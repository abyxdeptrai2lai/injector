name: Build Windows EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: cl /std:c++17 /O2 /EHsc /Fe:injector.exe injector.cpp kernel32.lib user32.lib shell32.lib
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: injector-exe
          path: injector.exe
